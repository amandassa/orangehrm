name: end-to-end

on:
  push:
    branches:
      - add-e2e-testRigor-tests
  pull_request:

jobs:
  installation:
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mariadb:10.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml, curl, zip, intl, mysql, gd, bcmath, soap, json, opcache
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip apache2 mysql-client

      - name: Configure Apache
        run: |
          sudo systemctl start apache2
          sudo systemctl enable apache2
          # Configure Apache document root if needed
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html

      - name: Install PHP dependencies
        run: |
          composer install --no-dev --optimize-autoloader -d src
          composer install --no-dev --optimize-autoloader -d devTools/core

      - name: Install OrangeHRM with empty database password
        run: |
          # Initial setup and configuration
          git checkout installer/cli_install_config.yaml
          sed -i 's/useSameDbUserForOrangeHRM: y/useSameDbUserForOrangeHRM: n/g' installer/cli_install_config.yaml
          sed -i 's/orangehrmDatabaseUser: ~/orangehrmDatabaseUser: orangehrm_1/g' installer/cli_install_config.yaml
          
          # Install OrangeHRM
          php installer/cli_install.php

      - name: Install OrangeHRM with database user and password
        run: |
          # Reset for second installation test
          php devTools/core/console.php i:reset
          git checkout installer/cli_install_config.yaml
          sed -i 's/useSameDbUserForOrangeHRM: y/useSameDbUserForOrangeHRM: n/g' installer/cli_install_config.yaml
          sed -i 's/orangehrmDatabaseUser: ~/orangehrmDatabaseUser: orangehrm_2/g' installer/cli_install_config.yaml
          sed -i 's/orangehrmDatabasePassword: ~/orangehrmDatabasePassword: 0rang3h!m/g' installer/cli_install_config.yaml
          sed -i 's/databaseName: orangehrm_mysql/databaseName: db/g' installer/cli_install_config.yaml
          
          # Install OrangeHRM
          php installer/cli_install.php

      - name: Install OrangeHRM on new database
        run: |
          # Reset and use console installer
          php devTools/core/console.php i:reset
          php installer/console install:on-new-database

      - name: Test connectivity
        run: |
          # Test HTTP connectivity
          curl -LI http://localhost/web/index.php/auth/login || echo "Local auth page not accessible"
          curl -LI http://127.0.0.1:80 || echo "Localhost not accessible" 

      - name: Setup and run testRigor tests
        env:
          SUITE_ID: ${{ secrets.TESTRIGOR_SUITE_ID }}
          AUTH_TOKEN: ${{ secrets.TESTRIGOR_AUTH_TOKEN }}
        run: |
          # Make script executable and run testRigor tests
          chmod +x src/test/testRigor/run_testrigor_tests.sh
          
          # Install Node.js dependencies needed by the script
          which node || sudo apt-get install -y nodejs npm
          
          # Run the testRigor tests
          ./src/test/testRigor/run_testrigor_tests.sh

      - name: Check dev tool reinstall command
        run: |
          php devTools/core/console.php i:reinstall
